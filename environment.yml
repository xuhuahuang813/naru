name: naru
channels:
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/pytorch
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
dependencies:
  - python=3.9
  - numpy=1.21
  - pandas=1.1.5
  - scipy=1.7.3           # ✔️ 来自 conda-forge，兼容 numpy 1.21
  - pytorch=2.2
  - torchvision=0.17
  - cudatoolkit=11.8      # ✔️ 兼容 torch 2.2，conda-forge/pytorch 通用版本
  - pip
